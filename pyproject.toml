[project]
name = "tcode"
version = "0.1.0"
description = "A fast, small system-wide terminal coding CLI that wraps free-tier LLMs (Groq by default, Google Gemini too, other backends pluggable). Built on Pydantic AI plus Pydantic AI Harness. Suited to scripted, non-interactive runs that turn a prompt over a codebase or data files into a parseable answer, with guardrails for unattended use, as well as everyday interactive edits. Built and run on Linux; not tested or packaged for Windows."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic-ai-slim[groq,google,zai,duckduckgo,web-fetch,tavily]>=2.33.0",
  "pydantic-ai-harness>=0.24.0",
  "python-dotenv>=1.0.1",
  "rich>=13.9.4",
  "prompt-toolkit>=3.0.47",
]

[project.scripts]
tcode = "src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
